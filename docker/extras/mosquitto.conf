# Copy this file to  mosquitto/config/mosquitto.conf  (see Project 6).
#
# Mosquitto 2 refuses outside connections unless you say who may connect.
# Step 1 (learning): password-protected. Make the password file with:
#   docker run --rm -it -v "$PWD/mosquitto/config:/c" eclipse-mosquitto:2 \
#       mosquitto_passwd -c /c/passwords garden
# (it asks you to type a password twice; use a NEW one, not any other password)
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwords
persistence true
persistence_location /mosquitto/data/
