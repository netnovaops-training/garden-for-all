<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery Loader — Scene Preview</title>
<style>
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#f4f4f6; color:#222; padding:24px; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:#666; font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
  .card { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 4px 18px rgba(0,0,0,.08); }
  .scene { width:100%; aspect-ratio:400/290; }
  .scene svg { display:block; width:100%; height:100%; }
  .meta { padding:10px 14px; }
  .meta .s { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:#888; font-weight:700; }
  .meta .t { font-size:.95rem; font-weight:600; }

/* ── Loader keyframes (copied from gallery.php) ─────────────── */
@keyframes popIn   { from{transform:scale(0);opacity:0}    to{transform:scale(1);opacity:1} }
@keyframes fadeIn  { from{opacity:0}                       to{opacity:1} }
@keyframes sway    { 0%,100%{transform:rotate(-4deg)}      50%{transform:rotate(4deg)} }
@keyframes swayL   { 0%,100%{transform:rotate(3deg)}       50%{transform:rotate(-3deg)} }
@keyframes pulse   { 0%,100%{transform:scale(1)}           50%{transform:scale(1.06)} }
@keyframes spin    { from{transform:rotate(0deg)}          to{transform:rotate(360deg)} }
@keyframes spinR   { from{transform:rotate(360deg)}        to{transform:rotate(0deg)} }
@keyframes bobY    { 0%,100%{transform:translateY(0)}      50%{transform:translateY(-8px)} }
@keyframes bobX    { 0%,100%{transform:translateX(0)}      50%{transform:translateX(10px)} }
@keyframes flicker { 0%,100%{opacity:1} 45%{opacity:.85}  46%{opacity:0} 47%{opacity:.9} 60%{opacity:0} 61%{opacity:1} }
@keyframes rainRow { from{transform:translateY(-30px)}     to{transform:translateY(310px)} }
@keyframes lf1 { 0%{transform:translate(0,0) rotate(0deg);opacity:1}   100%{transform:translate(60px,290px) rotate(540deg);opacity:0} }
@keyframes lf2 { 0%{transform:translate(0,0) rotate(20deg);opacity:1}  100%{transform:translate(-50px,290px) rotate(-480deg);opacity:0} }
@keyframes lf3 { 0%{transform:translate(0,0) rotate(-10deg);opacity:1} 100%{transform:translate(80px,290px) rotate(600deg);opacity:0} }
@keyframes lf4 { 0%{transform:translate(0,0) rotate(30deg);opacity:1}  100%{transform:translate(-70px,290px) rotate(-360deg);opacity:0} }
@keyframes lf5 { 0%{transform:translate(0,0) rotate(0deg);opacity:1}   100%{transform:translate(30px,290px) rotate(720deg);opacity:0} }
@keyframes sf1 { 0%{transform:translate(0,-10px);opacity:.9}  100%{transform:translate(12px,310px);opacity:.1} }
@keyframes sf2 { 0%{transform:translate(0,-10px);opacity:.8}  100%{transform:translate(-10px,310px);opacity:.1} }
@keyframes sf3 { 0%{transform:translate(0,-10px);opacity:.7}  100%{transform:translate(18px,310px);opacity:.1} }
@keyframes sf4 { 0%{transform:translate(0,-10px);opacity:.9}  100%{transform:translate(-8px,310px);opacity:.1} }
@keyframes growUp  { from{transform:scaleY(0);transform-origin:bottom} to{transform:scaleY(1);transform-origin:bottom} }
@keyframes bloom   { from{transform:scale(0) rotate(-20deg)} to{transform:scale(1) rotate(0deg)} }
@keyframes zap     { 0%,100%{opacity:0} 10%{opacity:1} 12%{opacity:0} 15%{opacity:.8} 18%{opacity:0} }
@keyframes bee     { 0%{transform:translate(0,0) rotate(0deg)} 25%{transform:translate(30px,-20px) rotate(5deg)} 50%{transform:translate(0,-35px) rotate(0deg)} 75%{transform:translate(-30px,-20px) rotate(-5deg)} 100%{transform:translate(0,0) rotate(0deg)} }
@keyframes bfly    { 0%,100%{transform:translate(0,0) rotate(0deg)} 33%{transform:translate(40px,-25px) rotate(10deg)} 66%{transform:translate(-20px,-40px) rotate(-8deg)} }
@keyframes flap    { 0%,100%{transform:scaleX(1)}  50%{transform:scaleX(-1)} }
@keyframes drift   { 0%,100%{transform:translateX(0)} 50%{transform:translateX(18px)} }
@keyframes rayP    { 0%,100%{opacity:.7;transform:scaleX(1)} 50%{opacity:1;transform:scaleX(1.15)} }
@keyframes twink   { 0%,100%{opacity:.9} 50%{opacity:.2} }
@keyframes riseUp  { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes windShake{ 0%,100%{transform:skewX(0)} 25%{transform:skewX(-3deg)} 75%{transform:skewX(2deg)} }
</style>
</head>
<body>
<h1>Gallery loader — all 8 seasonal scenes</h1>
<p class="sub">Same code as <code>gallery.php</code>, with the bee &amp; bat positioning fixes applied. Watch the summer Harvest bee and the Pumpkin Patch bat: they should now hover over the garden, not the top-left corner.</p>
<div class="grid" id="grid"></div>

<script>
function snowflakes(n) {
    const cols=['#e8f4fd','#d0e8f8','#ffffff','#c8dff5'];
    let s='';
    const xs=[30,75,120,165,210,255,300,345,385,50,150,250,350,100,200];
    const sizes=[5,7,4,6,8,5,4,7,6,5,8,4,7,6,5];
    const anims=['sf1','sf2','sf3','sf4','sf1','sf2','sf3','sf4','sf1','sf2'];
    const durs=[2.8,3.4,2.5,3.8,3.0,2.7,3.5,2.9,3.2,3.6,2.6,4.0,2.8,3.3,3.7];
    const dels=[0,.4,.8,1.2,.2,.6,1.0,0,.3,.7,1.1,.5,.9,.1,1.3];
    for(let i=0;i<n;i++){
        s+=`<circle cx="${xs[i%xs.length]}" cy="${-10-i*4}" r="${sizes[i%sizes.length]/2}"
            fill="${cols[i%cols.length]}" opacity=".8"
            style="animation:${anims[i%anims.length]} ${durs[i%durs.length]}s ${dels[i%dels.length]}s infinite linear"/>`;
    }
    return s;
}
function pine(cx, scale=1, dark=false) {
    const g=dark?'#1a3a0d':'#2d6e1a', m=dark?'#245914':'#3a8a24', l=dark?'#2d5a1b':'#4aa030';
    const s=scale;
    return `<g transform="translate(${cx},0) scale(${s})">
        <rect x="-4" y="220" width="8" height="20" fill="#6b4226"/>
        <polygon points="0,140 -28,210 28,210" fill="${g}"/>
        <polygon points="0,115 -24,185 24,185" fill="${m}"/>
        <polygon points="0,90 -20,160 20,160" fill="${l}"/>
        <polygon points="-5,210 0,185 5,210" fill="white" opacity=".55"/>
        <polygon points="-4,185 0,158 4,185" fill="white" opacity=".45"/>
        <polygon points="-3,160 0,135 3,160" fill="white" opacity=".40"/>
    </g>`;
}
function tulip(cx, col, delay) {
    return `<g transform="translate(${cx},0)"><g style="animation:riseUp .6s ${delay}s both ease-out">
        <line x1="0" y1="290" x2="0" y2="230" stroke="#3a8a24" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="265" x2="-12" y2="255" stroke="#3a8a24" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="255" x2="12" y2="244" stroke="#3a8a24" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="-5" cy="224" rx="10" ry="17" fill="${col}" transform="rotate(-8,-5,224)" style="animation:bloom .4s ${delay+.3}s both"/>
        <ellipse cx=" 5" cy="222" rx="10" ry="17" fill="${col}" transform="rotate( 8, 5,222)" style="animation:bloom .4s ${delay+.3}s both"/>
        <ellipse cx="0" cy="215" rx="9" ry="18" fill="${col}" style="animation:bloom .4s ${delay+.35}s both"/>
    </g></g>`;
}
function leaf(cx, cy, col, anim, dur, del, rot=0) {
    return `<ellipse cx="${cx}" cy="${cy}" rx="9" ry="6" fill="${col}"
        transform="rotate(${rot},${cx},${cy})"
        style="animation:${anim} ${dur}s ${del}s infinite ease-in"/>`;
}
