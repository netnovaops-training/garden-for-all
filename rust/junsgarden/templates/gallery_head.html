<style>
/* ── Seasonal animated loader ─────────────────────────────── */
#gal-loader {
    position: fixed; inset: 0; z-index: 8000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    transition: opacity .6s ease, visibility .6s ease; overflow: hidden;
}
#gal-loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
#season-scene { width: min(420px,92vw); height: auto; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.2); flex-shrink: 0; }
#season-scene svg { display: block; width: 100%; height: auto; }
#season-label { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
#season-tag   { font-size: 1.05rem; font-weight: 600; }
.gal-progress-track { width: min(340px,70vw); height: 7px; background: rgba(0,0,0,.15); border-radius: 999px; overflow: hidden; }
.gal-progress-fill  { height: 100%; width: 0%; border-radius: 999px; transition: width .25s ease; }
.gal-loader-label   { font-size: .78rem; opacity: .7; }

/* ── Loader keyframes ─────────────────────────────────────── */
@keyframes popIn   { from{transform:scale(0);opacity:0}    to{transform:scale(1);opacity:1} }
@keyframes fadeIn  { from{opacity:0}                       to{opacity:1} }
@keyframes sway    { 0%,100%{transform:rotate(-4deg)}      50%{transform:rotate(4deg)} }
@keyframes swayL   { 0%,100%{transform:rotate(3deg)}       50%{transform:rotate(-3deg)} }
@keyframes pulse   { 0%,100%{transform:scale(1)}           50%{transform:scale(1.06)} }
@keyframes spin    { from{transform:rotate(0deg)}          to{transform:rotate(360deg)} }
@keyframes spinR   { from{transform:rotate(360deg)}        to{transform:rotate(0deg)} }
@keyframes bobY    { 0%,100%{transform:translateY(0)}      50%{transform:translateY(-8px)} }
@keyframes bobX    { 0%,100%{transform:translateX(0)}      50%{transform:translateX(10px)} }
@keyframes flicker { 0%,100%{opacity:1} 45%{opacity:.85}  46%{opacity:0} 47%{opacity:.9} 60%{opacity:0} 61%{opacity:1} }
@keyframes rainRow { from{transform:translateY(-30px)}     to{transform:translateY(310px)} }
@keyframes lf1 { 0%{transform:translate(0,0) rotate(0deg);opacity:1}   100%{transform:translate(60px,290px) rotate(540deg);opacity:0} }
@keyframes lf2 { 0%{transform:translate(0,0) rotate(20deg);opacity:1}  100%{transform:translate(-50px,290px) rotate(-480deg);opacity:0} }
@keyframes lf3 { 0%{transform:translate(0,0) rotate(-10deg);opacity:1} 100%{transform:translate(80px,290px) rotate(600deg);opacity:0} }
@keyframes lf4 { 0%{transform:translate(0,0) rotate(30deg);opacity:1}  100%{transform:translate(-70px,290px) rotate(-360deg);opacity:0} }
@keyframes lf5 { 0%{transform:translate(0,0) rotate(0deg);opacity:1}   100%{transform:translate(30px,290px) rotate(720deg);opacity:0} }
@keyframes sf1 { 0%{transform:translate(0,-10px);opacity:.9}  100%{transform:translate(12px,310px);opacity:.1} }
@keyframes sf2 { 0%{transform:translate(0,-10px);opacity:.8}  100%{transform:translate(-10px,310px);opacity:.1} }
@keyframes sf3 { 0%{transform:translate(0,-10px);opacity:.7}  100%{transform:translate(18px,310px);opacity:.1} }
@keyframes sf4 { 0%{transform:translate(0,-10px);opacity:.9}  100%{transform:translate(-8px,310px);opacity:.1} }
@keyframes growUp  { from{transform:scaleY(0);transform-origin:bottom} to{transform:scaleY(1);transform-origin:bottom} }
@keyframes bloom   { from{transform:scale(0) rotate(-20deg)} to{transform:scale(1) rotate(0deg)} }
@keyframes zap     { 0%,100%{opacity:0} 10%{opacity:1} 12%{opacity:0} 15%{opacity:.8} 18%{opacity:0} }
@keyframes bee     { 0%{transform:translate(0,0) rotate(0deg)} 25%{transform:translate(30px,-20px) rotate(5deg)} 50%{transform:translate(0,-35px) rotate(0deg)} 75%{transform:translate(-30px,-20px) rotate(-5deg)} 100%{transform:translate(0,0) rotate(0deg)} }
@keyframes bfly    { 0%,100%{transform:translate(0,0) rotate(0deg)} 33%{transform:translate(40px,-25px) rotate(10deg)} 66%{transform:translate(-20px,-40px) rotate(-8deg)} }
@keyframes flap    { 0%,100%{transform:scaleX(1)}  50%{transform:scaleX(-1)} }
@keyframes drift   { 0%,100%{transform:translateX(0)} 50%{transform:translateX(18px)} }
@keyframes rayP    { 0%,100%{opacity:.7;transform:scaleX(1)} 50%{opacity:1;transform:scaleX(1.15)} }
@keyframes twink   { 0%,100%{opacity:.9} 50%{opacity:.2} }
@keyframes riseUp  { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes windShake{ 0%,100%{transform:skewX(0)} 25%{transform:skewX(-3deg)} 75%{transform:skewX(2deg)} }

/* ── Gallery page reset ───────────────────────────────────── */
html, body { margin: 0; padding: 0; overflow: hidden; background: #fff; }
/* footer z-index:20 in global CSS beats gallery z-index:2; hide it */
footer { display: none !important; }

/* ── Gallery stage ────────────────────────────────────────── */
#gallery-stage {
    position: fixed; inset: 0; z-index: 2; overflow: hidden; background: #fff;
}

/* ── Moving canvases A & B — seamless dual crossfade ──────── */
.gallery-canvas {
    position: absolute; top: 0; left: 0;
    will-change: transform, opacity; transform: translateZ(0);
}

/* ── Bricks ───────────────────────────────────────────────── */
.photo-item {
    position: absolute; overflow: hidden; border-radius: 6px; cursor: pointer;
    transition: filter .25s ease, transform .25s ease;
    box-shadow: 0 1px 5px rgba(0,0,0,.08); background: #f0f0f0;
}
.photo-item:hover { filter: brightness(1.06); transform: scale(1.025); z-index: 3; }
.photo-item img, .photo-item video {
    width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none;
}
.photo-item img { image-orientation: from-image; -webkit-image-orientation: from-image; }
.photo-item .video-badge {
    position: absolute; bottom: 7px; right: 8px; width: 26px; height: 26px;
    background: rgba(0,0,0,.45); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: .65rem; color: #fff; backdrop-filter: blur(4px);
}

/* ── Edge fades ───────────────────────────────────────────── */
.fade-edge { position: fixed; z-index: 50; pointer-events: none; }
#fade-top    { top:0;    left:0;   right:0;   height:160px; background:linear-gradient(to bottom, rgba(255,255,255,1) 0%,rgba(255,255,255,.6) 55%,rgba(255,255,255,0) 100%); }
#fade-bottom { bottom:0; left:0;   right:0;   height:160px; background:linear-gradient(to top,    rgba(255,255,255,1) 0%,rgba(255,255,255,.6) 55%,rgba(255,255,255,0) 100%); }
#fade-left   { top:0;    bottom:0; left:0;    width:140px;  background:linear-gradient(to right,  rgba(255,255,255,1) 0%,rgba(255,255,255,.6) 55%,rgba(255,255,255,0) 100%); }
#fade-right  { top:0;    bottom:0; right:0;   width:140px;  background:linear-gradient(to left,   rgba(255,255,255,1) 0%,rgba(255,255,255,.6) 55%,rgba(255,255,255,0) 100%); }

/* ── Search bar — centred on desktop ─────────────────────── */
#search-wrap {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none;
}
/* The pill container grows to hold pills + input on the same line */
#search-box {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 24px; padding: 10px 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.10), 0 0 0 1px rgba(0,0,0,.06);
    min-width: min(520px,88vw); pointer-events: auto; transition: box-shadow .2s ease;
}
#search-box:focus-within {
    box-shadow: 0 10px 50px rgba(0,0,0,.22), 0 2px 10px rgba(0,0,0,.12), 0 0 0 2px rgba(58,125,68,.4);
}
/* Green tag pills */
.tag-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: #3a7d44; color: #fff;
    padding: 5px 10px 5px 13px;
    border-radius: 999px; font-size: .82rem; font-weight: 600;
    white-space: nowrap; user-select: none;
    animation: pillPop .18s ease-out both;
}
@keyframes pillPop { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
.tag-pill-x {
    background: rgba(255,255,255,.28); border: none; color: #fff;
    border-radius: 50%; width: 18px; height: 18px; flex-shrink: 0;
    font-size: .6rem; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
}
.tag-pill-x:hover { background: rgba(255,255,255,.55); }
/* AND label between pills */
.pill-and {
    font-size: .65rem; color: #aaa; font-style: italic;
    flex-shrink: 0; user-select: none; align-self: center;
}
/* Input row inside the box */
#search-input-wrap { position: relative; display: flex; align-items: center; gap: 6px; flex: 1; min-width: 140px; }
#search-icon  { color:#bbb; flex-shrink:0; font-size:1.05rem; line-height:1; user-select:none; }
#search-input { flex:1; border:none; background:transparent; outline:none; font-size:.95rem; color:#222; min-width:0; padding: 4px 0; }
#search-input::placeholder { color:#bbb; }
#search-clear { background:none; border:none; cursor:pointer; color:#bbb; font-size:.8rem; padding:2px 5px; border-radius:50%; display:none; line-height:1; pointer-events:auto; transition:color .15s; flex-shrink:0; }
#search-clear:hover { color:#666; }
/* Autocomplete dropdown */
#gal-suggestions {
    position: absolute; top: calc(100% + 10px); left: -16px;
    min-width: 240px; max-width: 320px; max-height: 260px; overflow-y: auto;
    background: #fff; border: 1.5px solid #e0e0e0; border-radius: 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,.15); z-index: 300; display: none;
    overscroll-behavior: contain;
}
#gal-suggestions.open { display: block; }
.sug-row {
    padding: 10px 14px; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer; font-size: .84rem; gap: 10px;
    transition: background .1s;
}
.sug-row:hover, .sug-row.kb-sel { background: #f0f7f1; }
.sug-row.already { background: #e8f5e9; }
.sug-row strong { color: #3a7d44; }
.sug-badge {
    font-size: .7rem; color: #aaa; background: #f0f0f0;
    border-radius: 999px; padding: 2px 8px; flex-shrink: 0;
}
.sug-row.already .sug-badge { background: #3a7d44; color: #fff; }
#search-result { font-size:.78rem; color:#666; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border-radius:999px; padding:5px 16px; display:none; pointer-events:none; box-shadow:0 2px 12px rgba(0,0,0,.1); }

/* ── Empty state ──────────────────────────────────────────── */
#gallery-empty { display:none; position:fixed; inset:0; align-items:center; justify-content:center; flex-direction:column; z-index:5; color:#aaa; font-size:1rem; text-align:center; gap:14px; background:#fff; }
#gallery-empty.on { display:flex; }
#gallery-empty .empty-icon { font-size:3rem; }

/* ── Lightbox ─────────────────────────────────────────────── */
#lb { display:none; position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.96); align-items:center; justify-content:center; flex-direction:column; }
#lb.on { display:flex; }
#lb-img   { max-width:90vw; max-height:78vh; object-fit:contain; border-radius:4px; transition:opacity .2s; image-orientation:from-image; -webkit-image-orientation:from-image; }
#lb-video { display:none; max-width:90vw; max-height:78vh; border-radius:4px; outline:none; background:#000; }
#lb-info  { margin-top:12px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
#lb-name  { color:rgba(255,255,255,.45); font-size:.8rem; max-width:80vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#lb-tags  { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:80vw; }
.lb-tag   { padding:3px 12px; border-radius:999px; font-size:.75rem; background:rgba(255,255,255,.12); color:#ccc; cursor:pointer; transition:background .15s; }
.lb-tag:hover { background:var(--primary-green,#4A7c59); color:#fff; }
#lb-ctr   { color:rgba(255,255,255,.3); font-size:.72rem; }
#lb-dl    { display:inline-flex; align-items:center; gap:6px; padding:8px 20px; border-radius:999px; background:#3a7d44; color:#fff; font-size:.85rem; font-weight:600; text-decoration:none; transition:background .15s, transform .1s; }
#lb-dl:hover { background:#2d6235; transform:scale(1.04); }
.lb-nav { position:fixed; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.08); border:none; color:#fff; font-size:1.6rem; width:46px; height:46px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; z-index:9001; }
.lb-nav:hover { background:rgba(255,255,255,.22); }
#lb-prev { left:12px; } #lb-next { right:12px; }
#lb-close { position:fixed; top:14px; right:16px; background:none; border:none; color:rgba(255,255,255,.55); font-size:1.8rem; cursor:pointer; z-index:9001; line-height:1; }
#lb-close:hover { color:#fff; }

/* ── Mobile / tablet — search moves to bottom ────────────── */
@media (max-width: 1024px) {
    #search-wrap  { top:auto; bottom:24px; transform:translateX(-50%); }
    #search-box   { padding:10px 16px; min-width:min(88vw,360px); }
    #search-input { font-size:.9rem; }
    /* Suggestions open ABOVE the search bar — it's at the bottom of the screen */
    #gal-suggestions { top:auto; bottom:calc(100% + 10px); }
}
/* ── Small phone — tighter fades, smaller hover scale ──────── */
@media (max-width: 600px) {
    #fade-top    { height:90px; }
    #fade-bottom { height:90px; }
    #fade-left   { width:50px; }
    #fade-right  { width:50px; }
    .photo-item:hover { transform:scale(1.01); }
    #lb-prev { left:4px; } #lb-next { right:4px; }
    .lb-nav  { width:40px; height:40px; font-size:1.4rem; }
}
</style>
