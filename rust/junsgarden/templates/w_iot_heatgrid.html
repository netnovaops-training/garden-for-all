<div class="widget-card" data-tags="weather temperature heatmap grid hourly" style="grid-column: span 2;">
    <div class="widget-header">
        <span class="widget-icon">🗓️</span>
        <h3>Weather Heatmap{% if !live %} (Demo){% endif %}</h3>
    </div>
    <div class="widget-body" style="padding:12px 16px;">
        {% if !live %}
        <div style="background:#fff3e0;border:1px solid #ffe0b2;border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:0.75rem;color:#e65100;">
            🔌 <strong>Demo data</strong> — connect InfluxDB for real hourly patterns
        </div>
        {% endif %}

        <!-- Controls -->
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
            <div style="display:flex;gap:6px;">
                <label style="font-size:0.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;">
                    <input type="radio" name="{{ uid }}_range" value="30d" checked style="accent-color:#2e7d32;"> Last 30 Days
                </label>
                <label style="font-size:0.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;">
                    <input type="radio" name="{{ uid }}_range" value="12m" style="accent-color:#2e7d32;"> 12 Months
                </label>
            </div>
            <select id="{{ uid }}_metric" style="padding:6px 10px;border-radius:8px;border:2px solid #222;font-size:0.85rem;font-weight:600;">
                <option value="temp">🌡️ Temperature</option>
                <option value="hum">💧 Humidity</option>
                <option value="wind">💨 Wind Speed</option>
                <option value="uv">☀️ UV Index</option>
            </select>
        </div>

        <!-- Grid container -->
        <div id="{{ uid }}_grid" style="overflow-x:auto;"></div>

        <!-- Legend -->
        <div id="{{ uid }}_legend" style="display:flex;gap:4px;justify-content:center;margin-top:8px;font-size:0.72rem;font-weight:600;"></div>
    </div>

    <script>
    (function(){
        const uid = '{{ uid }}';
        const data30 = {{ data30_json|safe }};
        const data12 = {{ data12_json|safe }};

        const dayLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const monthLabels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const hourLabels = [];
        for (let h = 0; h < 24; h++) {
            hourLabels.push(h === 0 ? '12a' : h < 12 ? h + 'a' : h === 12 ? '12p' : (h-12) + 'p');
        }

        // Color scales per metric
        const scales = {
            temp: { min: 20, max: 90,
                colors: ['#313695','#4575b4','#74add1','#abd9e9','#e0f3f8','#fee090','#fdae61','#f46d43','#d73027','#a50026'] },
            hum:  { min: 20, max: 100,
                colors: ['#fff5eb','#fee6ce','#fdd0a2','#fdae6b','#fd8d3c','#f16913','#d94801','#a63603','#7f2704'] },
            wind: { min: 0, max: 25,
                colors: ['#f7fbff','#deebf7','#c6dbef','#9ecae1','#6baed6','#4292c6','#2171b5','#08519c','#08306b'] },
            uv:   { min: 0, max: 11,
                colors: ['#4CAF50','#8BC34A','#CDDC39','#FFEB3B','#FFC107','#FF9800','#FF5722','#F44336','#E91E63','#9C27B0'] },
        };

        function getColor(metric, value) {
            const s = scales[metric];
            if (value === null || value === undefined) return '#f0f0f0';
            const ratio = Math.max(0, Math.min(1, (value - s.min) / (s.max - s.min)));
            const idx = Math.min(Math.floor(ratio * (s.colors.length - 1)), s.colors.length - 1);
            return s.colors[idx];
        }

        function textColor(bgHex) {
            const r = parseInt(bgHex.slice(1,3), 16);
            const g = parseInt(bgHex.slice(3,5), 16);
            const b = parseInt(bgHex.slice(5,7), 16);
            return (r*0.299 + g*0.587 + b*0.114) > 150 ? '#333' : '#fff';
        }

        // 3-hour block labels for 30-day view
        const blockLabels = ['12a–3a','3a–6a','6a–9a','9a–12p','12p–3p','3p–6p','6p–9p','9p–12a'];
        // Week labels for 12-month view
        const weekLabels = ['Wk1','Wk2','Wk3','Wk4'];

        // Average hourly data into 3-hour blocks
        function avgBlock(rowData, startH, endH, key) {
            let sum = 0, count = 0;
            for (let h = startH; h < endH; h++) {
                const cell = rowData[String(h)] || rowData[h] || {};
                const v = cell[key];
                if (v !== null && v !== undefined) { sum += v; count++; }
            }
            return count > 0 ? Math.round(sum / count * 10) / 10 : null;
        }

        // Average hourly data into weekly blocks (6hr chunks per week approx)
        function avgWeek(rowData, weekIdx, key) {
            const startH = weekIdx * 6;
            const endH = Math.min(startH + 6, 24);
            return avgBlock(rowData, startH, endH, key);
        }

        function render() {
            const range = document.querySelector('input[name="'+uid+'_range"]:checked')?.value || '30d';
            const metric = document.getElementById(uid + '_metric')?.value || 'temp';
            const grid = document.getElementById(uid + '_grid');
            const legend = document.getElementById(uid + '_legend');
            if (!grid) return;

            const data = range === '30d' ? data30 : data12;
            const rowLabels = range === '30d' ? dayLabels : monthLabels;
            const rowCount = range === '30d' ? 7 : 12;
            const colLabels = range === '30d' ? blockLabels : weekLabels;
            const colCount = range === '30d' ? 8 : 4;
            const s = scales[metric];
            const units = { temp: '°F', hum: '%', wind: 'mph', uv: '' };
            const metricKey = { temp: 'temp', hum: 'hum', wind: 'wind', uv: 'uv' };

            let html = '<table style="border-collapse:collapse;width:100%;table-layout:fixed;">';
            html += '<tr><th style="width:50px;"></th>';
            for (let c = 0; c < colCount; c++) {
                html += '<th style="font-size:0.78rem;font-weight:700;color:#555;padding:6px 4px;text-align:center;">' + colLabels[c] + '</th>';
            }
            html += '</tr>';

            for (let r = 0; r < rowCount; r++) {
                html += '<tr>';
                html += '<th style="font-size:0.85rem;font-weight:700;color:#333;padding:8px 8px;text-align:right;white-space:nowrap;">' + rowLabels[r] + '</th>';
                const rowData = data[String(r)] || data[r] || {};

                for (let c = 0; c < colCount; c++) {
                    let val;
                    if (range === '30d') {
                        val = avgBlock(rowData, c * 3, c * 3 + 3, metricKey[metric]);
                    } else {
                        val = avgWeek(rowData, c, metricKey[metric]);
                    }
                    const bg = getColor(metric, val);
                    const fg = textColor(bg);
                    const display = val !== null ? val : '';
                    const tip = rowLabels[r] + ' · ' + colLabels[c] + ': ' + display + units[metric];
                    html += '<td style="background:' + bg + ';color:' + fg + ';text-align:center;font-size:0.9rem;font-weight:700;padding:10px 4px;border:2px solid rgba(255,255,255,0.4);cursor:default;border-radius:4px;" title="' + tip + '">' + display + '</td>';
                }
                html += '</tr>';
            }
            html += '</table>';
            grid.innerHTML = html;

            let legendHtml = '<span style="color:#888;">Low</span>';
            s.colors.forEach(c => {
                legendHtml += '<span style="display:inline-block;width:28px;height:16px;background:' + c + ';border-radius:3px;"></span>';
            });
            legendHtml += '<span style="color:#888;">High</span>';
            legend.innerHTML = legendHtml;
        }

        // Wire controls
        document.querySelectorAll('input[name="'+uid+'_range"]').forEach(r => r.addEventListener('change', render));
        document.getElementById(uid + '_metric')?.addEventListener('change', render);

        render();
    })();
    </script>
</div>
