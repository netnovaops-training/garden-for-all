
<!-- ── Seasonal animated loading screen ──────────────────────── -->
<div id="gal-loader">
    <div id="season-scene"></div>
    <div id="season-label">Loading Gallery</div>
    <div id="season-tag"></div>
    <div class="gal-progress-track"><div class="gal-progress-fill" id="gal-pf"></div></div>
    <div class="gal-loader-label" id="gal-pl">0 / {{ total }}</div>

   SEASONAL LOADER — 8 animated SVG scenes (2 per season)
   Picked randomly on every page load.
══════════════════════════════════════════════════════════════ */
(function() {

function snowflakes(n) {
    const cols=['#e8f4fd','#d0e8f8','#ffffff','#c8dff5'];
    let s='';
    const xs=[30,75,120,165,210,255,300,345,385,50,150,250,350,100,200];
    const sizes=[5,7,4,6,8,5,4,7,6,5,8,4,7,6,5];
    const anims=['sf1','sf2','sf3','sf4','sf1','sf2','sf3','sf4','sf1','sf2'];
    const durs=[2.8,3.4,2.5,3.8,3.0,2.7,3.5,2.9,3.2,3.6,2.6,4.0,2.8,3.3,3.7];
    const dels=[0,.4,.8,1.2,.2,.6,1.0,0,.3,.7,1.1,.5,.9,.1,1.3];
    for(let i=0;i<n;i++){
        s+=`<circle cx="${xs[i%xs.length]}" cy="${-10-i*4}" r="${sizes[i%sizes.length]/2}"
            fill="${cols[i%cols.length]}" opacity=".8"
            style="animation:${anims[i%anims.length]} ${durs[i%durs.length]}s ${dels[i%dels.length]}s infinite linear"/>`;
    }
    return s;
}

function pine(cx, scale=1, dark=false) {
    const g=dark?'#1a3a0d':'#2d6e1a', m=dark?'#245914':'#3a8a24', l=dark?'#2d5a1b':'#4aa030';
    const s=scale;
    return `<g transform="translate(${cx},0) scale(${s})">
        <rect x="-4" y="220" width="8" height="20" fill="#6b4226"/>
        <polygon points="0,140 -28,210 28,210" fill="${g}"/>
        <polygon points="0,115 -24,185 24,185" fill="${m}"/>
        <polygon points="0,90 -20,160 20,160" fill="${l}"/>
        <polygon points="-5,210 0,185 5,210" fill="white" opacity=".55"/>
        <polygon points="-4,185 0,158 4,185" fill="white" opacity=".45"/>
        <polygon points="-3,160 0,135 3,160" fill="white" opacity=".40"/>
    </g>`;
}

function tulip(cx, col, delay) {
    return `<g transform="translate(${cx},0)"><g style="animation:riseUp .6s ${delay}s both ease-out">
        <line x1="0" y1="290" x2="0" y2="230" stroke="#3a8a24" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="265" x2="-12" y2="255" stroke="#3a8a24" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="255" x2="12" y2="244" stroke="#3a8a24" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="-5" cy="224" rx="10" ry="17" fill="${col}" transform="rotate(-8,-5,224)" style="animation:bloom .4s ${delay+.3}s both"/>
        <ellipse cx=" 5" cy="222" rx="10" ry="17" fill="${col}" transform="rotate( 8, 5,222)" style="animation:bloom .4s ${delay+.3}s both"/>
        <ellipse cx="0" cy="215" rx="9" ry="18" fill="${col}" style="animation:bloom .4s ${delay+.35}s both"/>
    </g></g>`;
}

function leaf(cx, cy, col, anim, dur, del, rot=0) {
    return `<ellipse cx="${cx}" cy="${cy}" rx="9" ry="6" fill="${col}"
        transform="rotate(${rot},${cx},${cy})"
        style="animation:${anim} ${dur}s ${del}s infinite ease-in"/>`;
}

<script>
// ════════════════════════════════════════════════════════════════
//  Gallery — Infinite 45° masonry brick scroll
//  Dual-canvas crossfade for flicker-free loop transitions
// ════════════════════════════════════════════════════════════════

const ALL_PHOTOS = {{ photos_json|safe }};

// ── Layout constants ─────────────────────────────────────────
const GAP   = 6;
const COL_W = window.innerWidth < 480 ? 140
            : window.innerWidth < 768 ? 175
            : 220;
const SPEED    = 20;   // px/s
const MIN_POOL = 80;   // repeat photos until pool reaches this size
const FADE_MS  = 1000; // crossfade duration at loop boundary (ms)

// ── State ────────────────────────────────────────────────────
let currentPhotos = [...ALL_PHOTOS];
let animId        = null;
let lbIdx         = 0;
let tileW = 0, tileH = 0, tx = 0, ty = 0, lastTs = 0;
let videoObserver = null;
let activeCanvas  = null;
let standbyCanvas = null;
let isCrossfading = false;

// ── Loader state ─────────────────────────────────────────────
let imgLoaded = 0;
const fill = document.getElementById('gal-pf');
const lbl  = document.getElementById('gal-pl');
const lodr = document.getElementById('gal-loader');
const t0   = Date.now();
function onMediaLoaded() {
    imgLoaded++;
    const pct = Math.round(imgLoaded / Math.max(ALL_PHOTOS.length,1) * 100);
    fill.style.width = pct + '%';
    lbl.textContent  = imgLoaded + ' / ' + ALL_PHOTOS.length;
}
if (ALL_PHOTOS.length === 0) lodr.classList.add('done');
setTimeout(() => lodr.classList.add('done'), 8000);

// ── Helpers ──────────────────────────────────────────────────
function expandPool(photos) {
    if (!photos.length) return [];
    let pool = [...photos];
    while (pool.length < MIN_POOL) pool = [...pool, ...photos];
    return pool;
}

function buildLayout(photos) {
    const VW      = window.innerWidth;
    const VH      = window.innerHeight;
    const numCols = Math.ceil(VW / (COL_W + GAP)) + 4;
    const heights = new Array(numCols).fill(0);
    const items   = [];
    const pool    = expandPool(photos);

    pool.forEach(photo => {
        let ar = (photo.w && photo.h) ? (photo.w / photo.h) : 1.333;
        if (!isFinite(ar) || ar <= 0) ar = 1.333;
        const imgH = Math.round(COL_W / ar);
        let col = 0;
        for (let c = 1; c < numCols; c++) {
            if (heights[c] < heights[col]) col = c;
        }
        items.push({ photo, x: col * (COL_W + GAP), y: heights[col], w: COL_W, h: imgH });
        heights[col] += imgH + GAP;
    });

    const tw = numCols * (COL_W + GAP);
    const th = Math.max(Math.max(...heights), VH * 2);
    return { items, tileW: tw, tileH: th };
}

// ── Canvas builder ────────────────────────────────────────────
function buildCanvasEl(photos, el, eagerLoad) {
    el.textContent = '';
    const emptyEl = document.getElementById('gallery-empty');
    if (!photos.length) { emptyEl.classList.add('on'); stopAnim(); return null; }
    emptyEl.classList.remove('on');

    const { items, tileW: tw, tileH: th } = buildLayout(photos);
    el.style.width  = (3 * tw) + 'px';
    el.style.height = (3 * th) + 'px';

    const frag = document.createDocumentFragment();

    for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
            const ox       = col * tw;
            const oy       = row * th;
            const isCentre = (row === 1 && col === 1);

            items.forEach(item => {
                const div      = document.createElement('div');
                div.className  = 'photo-item';
                div.style.left = (item.x + ox) + 'px';
                div.style.top  = (item.y + oy) + 'px';
                div.style.width  = item.w + 'px';
                div.style.height = item.h + 'px';

                if (item.photo.type === 'video') {
                    const vid       = document.createElement('video');
                    vid.src         = item.photo.src;
                    vid.muted       = true;
                    vid.loop        = true;
                    vid.playsInline = true;
                    vid.preload     = isCentre ? 'auto' : 'none';
                    const badge     = document.createElement('div');
                    badge.className = 'video-badge';
                    badge.textContent = '▶';
                    div.appendChild(vid);
                    div.appendChild(badge);
                } else {
                    const img    = document.createElement('img');
                    // Use thumbnail for performance; fall back to full image
                    img.src      = item.photo.thumb || item.photo.src;
                    img.alt      = item.photo.name || '';
                    img.loading  = eagerLoad ? 'eager' : 'lazy';
                    img.decoding = 'async';
                    if (isCentre) {
                        img.addEventListener('load',  onMediaLoaded, { once: true });
                        img.addEventListener('error', onMediaLoaded, { once: true });
                    }
                    div.appendChild(img);
                }

                const photoSrc = item.photo.src;
                div.addEventListener('click', () => {
                    const idx = currentPhotos.findIndex(p => p.src === photoSrc);
                    if (idx >= 0) lbOpen(idx);
                });
                frag.appendChild(div);
            });
        }
    }

    el.appendChild(frag);
    return { tileW: tw, tileH: th };
}

// ── Video IntersectionObserver ────────────────────────────────
function setupVideoObserver() {
    if (videoObserver) videoObserver.disconnect();
    const stage = document.getElementById('gallery-stage');
    videoObserver = new IntersectionObserver(entries => {
        entries.forEach(e => {
            if (e.isIntersecting) e.target.play().catch(() => {});
            else                  e.target.pause();
        });
    }, { root: stage, rootMargin: '80px', threshold: 0.01 });
    activeCanvas.querySelectorAll('video').forEach(v => videoObserver.observe(v));
}

// ── Animation loop ────────────────────────────────────────────
function tick(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;

    tx += SPEED * dt;   // scroll right
    ty -= SPEED * dt;   // scroll up

    if (tx >= 0) {
        crossfadeToNext();
        animId = requestAnimationFrame(tick);
        return;
    }
    if (ty <= -2 * tileH) ty += tileH;

    activeCanvas.style.transform = `translate3d(${tx}px,${ty}px,0)`;
    animId = requestAnimationFrame(tick);
}

function startAnim() { if (animId) return; lastTs = 0; animId = requestAnimationFrame(tick); }
function stopAnim()  { if (animId) { cancelAnimationFrame(animId); animId = null; } }

// ── Smooth crossfade between loops ────────────────────────────
function crossfadeToNext() {
    if (isCrossfading) {
        tx -= tileW;
        if (ty <= -2 * tileH) ty += tileH;
        activeCanvas.style.transform = `translate3d(${tx}px,${ty}px,0)`;
        return;
    }
    isCrossfading = true;

    tx -= tileW;
    if (ty <= -2 * tileH) ty += tileH;
    activeCanvas.style.transform = `translate3d(${tx}px,${ty}px,0)`;

    // Fisher-Yates shuffle for next pass
    for (let i = currentPhotos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentPhotos[i], currentPhotos[j]] = [currentPhotos[j], currentPhotos[i]];
    }

    if (videoObserver) videoObserver.disconnect();
    const result = buildCanvasEl(currentPhotos, standbyCanvas, true);
    if (!result) { isCrossfading = false; return; }

    const ntx = -result.tileW;
    const nty = -result.tileH;

    standbyCanvas.style.transition = 'none';
    standbyCanvas.style.opacity    = '0';
    standbyCanvas.style.zIndex     = '2';
    standbyCanvas.style.transform  = `translate3d(${ntx}px,${nty}px,0)`;

    requestAnimationFrame(() => {
        activeCanvas.style.transition  = `opacity ${FADE_MS}ms ease`;
        standbyCanvas.style.transition = `opacity ${FADE_MS}ms ease`;
        activeCanvas.style.opacity     = '0';
        standbyCanvas.style.opacity    = '1';

        setTimeout(() => {
            const tmp    = activeCanvas;
            activeCanvas  = standbyCanvas;
            standbyCanvas = tmp;

            tileW = result.tileW; tileH = result.tileH;
            tx = ntx; ty = nty;

            standbyCanvas.textContent      = '';
            standbyCanvas.style.opacity    = '';
            standbyCanvas.style.transition = '';
            standbyCanvas.style.zIndex     = '';
            activeCanvas.style.transition  = '';
            activeCanvas.style.opacity     = '';
            activeCanvas.style.zIndex      = '';

            isCrossfading = false;
            setupVideoObserver();
        }, FADE_MS + 60);
    });
}

// ── Start gallery ─────────────────────────────────────────────
function startGallery(photos) {
    stopAnim();
    isCrossfading = false;
    if (videoObserver) { videoObserver.disconnect(); videoObserver = null; }
    lastTs = 0;

    const result = buildCanvasEl(photos, activeCanvas, false);
    standbyCanvas.textContent      = '';
    standbyCanvas.style.opacity    = '';
    standbyCanvas.style.transition = '';
    standbyCanvas.style.zIndex     = '';
    activeCanvas.style.opacity     = '';
    activeCanvas.style.transition  = '';
    activeCanvas.style.zIndex      = '';

    if (!result) return;

    tileW = result.tileW; tileH = result.tileH;
    tx = -tileW; ty = -tileH;
    activeCanvas.style.transform = `translate3d(${tx}px,${ty}px,0)`;

    setupVideoObserver();
    startAnim();

    // Dismiss loader after some bricks have painted
    const mediaEls = Array.from(activeCanvas.querySelectorAll('img'));
    const TARGET   = Math.min(8, mediaEls.length);
    if (TARGET === 0) { lodr.classList.add('done'); return; }
    let ready = 0;
    function onReady() {
        ready++;
        if (ready >= TARGET)
            requestAnimationFrame(() => requestAnimationFrame(() => lodr.classList.add('done')));
    }
    mediaEls.slice(0, TARGET).forEach(el => {
        if (el.complete && el.naturalWidth > 0) onReady();
        else {
            el.addEventListener('load',  onReady, { once: true });
            el.addEventListener('error', onReady, { once: true });
        }
    });
}

// ════════════════════════════════════════════════════════════════
//  TAG SEARCH — pill-based multi-tag AND filter
//  Tags load async from CSV so the gallery starts scrolling
//  immediately while autocomplete builds in the background.
// ════════════════════════════════════════════════════════════════

const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
const resultEl    = document.getElementById('search-result');
const sugBox      = document.getElementById('gal-suggestions');
const searchBox   = document.getElementById('search-box');

// tagMap: filename → ['rose','red','garden',…]  (populated from CSV)
const tagMap = {};
// ALL_TAGS: [['rose',42],['red',35],…] sorted by frequency (from CSV)
let ALL_TAGS = [];
// Active pill tags (AND logic: photo must have ALL of these)
let activeTags = new Set();
let kbIdx = -1;

// Robust CSV line parser. The previous regex (/("..."|[^,]*)/g) emitted an
// empty phantom field between every real one, doubling the column count and
// shifting tags from index 6 to 12 — so the search matched a thumbnail path
// instead of the tags and never found anything. This handles quoted fields
// and escaped "" correctly and returns exactly the real columns.
function parseCsvLine(line) {
    const out = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (inQ) {
            if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
            else cur += c;
        } else if (c === '"') { inQ = true; }
        else if (c === ',') { out.push(cur); cur = ''; }
        else cur += c;
    }
    out.push(cur);
    return out;
}

// ── Load CSV async — builds autocomplete without blocking paint ──
fetch('images/Gallery/tags_cache.csv')
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(csv => {
        const counts = {};
        const lines  = csv.split('\n').slice(1);   // skip header
        lines.forEach(line => {
            if (!line.trim()) return;
            const cols = parseCsvLine(line);
            const fn   = cols[0];
            const tags = cols[6] ? cols[6].split('|').filter(Boolean) : [];
            if (!fn) return;
            tagMap[fn] = tags;
            tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
        });
        ALL_TAGS = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    })
    .catch(() => {
        // CSV not ready — fall back to tags already in ALL_PHOTOS
        ALL_PHOTOS.forEach(p => {
            if (p.fn && p.tags) tagMap[p.fn] = p.tags;
        });
        const counts = {};
        ALL_PHOTOS.forEach(p => (p.tags||[]).forEach(t => { counts[t] = (counts[t]||0)+1; }));
        ALL_TAGS = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    });

// ── Pill rendering ────────────────────────────────────────────
function renderPills() {
    // Remove any existing pills (keep #search-input-wrap last)
    const wrap = document.getElementById('search-input-wrap');
    while (searchBox.firstChild !== wrap) searchBox.removeChild(searchBox.firstChild);

    let i = 0;
    activeTags.forEach(tag => {
        if (i > 0) {
            const and = document.createElement('span');
            and.className = 'pill-and';
            and.textContent = 'AND';
            searchBox.insertBefore(and, wrap);
        }
        const pill = document.createElement('span');
        pill.className = 'tag-pill';
        pill.innerHTML =
            `${escHtml(tag)}<button class="tag-pill-x" aria-label="Remove ${escHtml(tag)}">✕</button>`;
        pill.querySelector('.tag-pill-x').addEventListener('click', () => removePill(tag));
        searchBox.insertBefore(pill, wrap);
        i++;
    });

    // Clear-all button appears when any pill is active
    const btn = document.getElementById('pill-clear-all');
    if (btn) btn.style.display = activeTags.size ? 'inline-flex' : 'none';
}

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Add / remove pills ────────────────────────────────────────
function addPill(tag) {
    if (activeTags.has(tag)) return;
    activeTags.add(tag);
    renderPills();
    applyFilter();
}

function removePill(tag) {
    activeTags.delete(tag);
    renderPills();
    applyFilter();
}

function clearAllPills() {
    activeTags.clear();
    renderPills();
    applyFilter();
}

// ── AND filter ────────────────────────────────────────────────
function applyFilter() {
    let filtered;
    if (activeTags.size === 0) {
        filtered = [...ALL_PHOTOS];
    } else {
        filtered = ALL_PHOTOS.filter(p => {
            // Use CSV-loaded tagMap if available, else fall back to inline tags
            const tags = tagMap[p.fn] || (p.tags || []);
            return [...activeTags].every(active =>
                tags.some(t => t.toLowerCase().includes(active.toLowerCase()))
            );
        });
    }
    currentPhotos = filtered;

    if (activeTags.size > 0) {
        resultEl.textContent   = filtered.length + ' photo' + (filtered.length === 1 ? '' : 's') + ' found';
        resultEl.style.display = 'block';
    } else {
        resultEl.style.display = 'none';
    }
    startGallery(filtered);
}

// ── Autocomplete ──────────────────────────────────────────────
function buildSuggestions(q) {
    sugBox.innerHTML = '';
    kbIdx = -1;
    if (!q.trim()) { sugBox.classList.remove('open'); return; }
    const lq = q.toLowerCase();
    const matches = ALL_TAGS.filter(([t]) => t.toLowerCase().includes(lq)).slice(0, 20);
    if (!matches.length) { sugBox.classList.remove('open'); return; }

    matches.forEach(([tag, cnt]) => {
        const div       = document.createElement('div');
        div.className   = 'sug-row' + (activeTags.has(tag) ? ' already' : '');
        div.setAttribute('role', 'option');
        div.dataset.tag = tag;
        const hi = escHtml(tag).replace(
            new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),
            '<strong>$1</strong>'
        );
        div.innerHTML = `<span>${hi}</span><span class="sug-badge">${cnt}</span>`;
        div.addEventListener('mousedown', e => { e.preventDefault(); commitTag(tag); });
        sugBox.appendChild(div);
    });
    sugBox.classList.add('open');
}

function commitTag(tag) {
    addPill(tag);
    searchInput.value = '';
    searchClear.style.display = 'none';
    sugBox.classList.remove('open');
    kbIdx = -1;
    searchInput.focus();
}

// ── Input events ──────────────────────────────────────────────
searchInput.addEventListener('input', () => {
    const v = searchInput.value;
    searchClear.style.display = v ? 'block' : 'none';
    buildSuggestions(v);
});

searchInput.addEventListener('keydown', e => {
    const rows = sugBox.querySelectorAll('.sug-row');
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        kbIdx = Math.min(kbIdx + 1, rows.length - 1);
        rows.forEach((r, i) => r.classList.toggle('kb-sel', i === kbIdx));
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        kbIdx = Math.max(kbIdx - 1, 0);
        rows.forEach((r, i) => r.classList.toggle('kb-sel', i === kbIdx));
    } else if (e.key === 'Enter' || e.key === ' ') {
        if (sugBox.classList.contains('open') && kbIdx >= 0 && rows[kbIdx]) {
            e.preventDefault();
            commitTag(rows[kbIdx].dataset.tag);
        } else if (searchInput.value.trim()) {
            e.preventDefault();
            const q     = searchInput.value.trim().toLowerCase();
            const exact = ALL_TAGS.find(([t]) => t.toLowerCase() === q);
            const first = ALL_TAGS.find(([t]) => t.toLowerCase().includes(q));
            if (exact) commitTag(exact[0]);
            else if (first) commitTag(first[0]);
            else commitTag(searchInput.value.trim()); // commit literal input
        }
    } else if (e.key === 'Backspace' && !searchInput.value && activeTags.size) {
        // Backspace on empty input removes the last pill
        const last = [...activeTags].pop();
        removePill(last);
    } else if (e.key === 'Escape') {
        sugBox.classList.remove('open');
        searchInput.value = '';
        searchClear.style.display = 'none';
    }
});

searchInput.addEventListener('blur', () => {
    setTimeout(() => sugBox.classList.remove('open'), 180);
});

searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.style.display = 'none';
    sugBox.classList.remove('open');
    searchInput.focus();
});

// Close suggestions when clicking outside
document.addEventListener('click', e => {
    if (!searchBox.contains(e.target)) sugBox.classList.remove('open');
});

// ── Lightbox ──────────────────────────────────────────────────
const lbImg = document.getElementById('lb-img');
const lbVid = document.getElementById('lb-video');
const preloaded = {};

function lbOpen(idx) {
    lbIdx = idx; lbShow();
    document.getElementById('lb').classList.add('on');
    document.body.style.overflow = 'hidden';
    stopAnim();
}

function lbClose() {
    lbVid.pause(); lbVid.src = '';
    lbVid.style.display = 'none'; lbImg.style.display = '';
    document.getElementById('lb').classList.remove('on');
    document.body.style.overflow = '';
    lastTs = 0; startAnim();
}

function lbMove(d) {
    lbIdx = (lbIdx + d + currentPhotos.length) % currentPhotos.length;
    lbShow();
}

function lbShow() {
    const p = currentPhotos[lbIdx];

    if (p.type === 'video') {
        lbImg.style.display = 'none';
        lbVid.style.display = 'block';
        lbVid.src = p.src; lbVid.load(); lbVid.play().catch(() => {});
    } else {
        lbVid.pause(); lbVid.style.display = 'none';
        lbImg.style.display = '';
        lbImg.style.opacity = '0';
        lbImg.src = p.src; lbImg.alt = p.name || '';
        lbImg.onload = () => { lbImg.style.opacity = '1'; };
    }

    document.getElementById('lb-name').textContent =
        p.name || '';

    const tagsEl = document.getElementById('lb-tags');
    tagsEl.innerHTML = '';
    (p.tags || []).forEach(t => {
        const s = document.createElement('span');
        s.className = 'lb-tag'; s.textContent = t;
        s.onclick = () => {
            lbClose();
            addPill(t);   // adds as a filter pill; AND with any existing pills
        };
        tagsEl.appendChild(s);
    });

    document.getElementById('lb-ctr').textContent =
        (lbIdx + 1) + ' / ' + currentPhotos.length;

    // Load per-image comments
    const imgKey  = p.src ? p.src.split('/').pop() : '';
    const cList   = document.getElementById('lb-comment-list');
    const cBtn    = document.getElementById('lb-cmt-btn');
    const cMsg    = document.getElementById('lb-cmt-msg');

    if (cList && imgKey) {
        cList.innerHTML = '<em style="color:#888;font-size:0.75rem;">Loading…</em>';
        fetch('comments.php?get_comments=1&type=gallery&key=' + encodeURIComponent(imgKey))
            .then(r => r.json())
            .then(d => {
                const rows = d.comments || [];
                cList.innerHTML = rows.length
                    ? rows.map(c =>
                        '<div style="border-bottom:1px solid rgba(255,255,255,0.08);padding:1px 0;">' +
                        '<strong style="color:#aed581;">' + c.name + '</strong>' +
                        '<span style="color:#666;font-size:0.7rem;margin:0 4px;">' + c.date + '</span>' +
                        c.message + '</div>'
                      ).join('')
                    : '<em style="color:#777;font-size:0.75rem;">No comments yet.</em>';
            }).catch(()=>{ cList.innerHTML=''; });
    }

    // Re-bind post button to current image key
    if (cBtn) {
        cBtn.onclick = async function(e) {
            e.stopPropagation();
            const name = (document.getElementById('lb-cmt-name')?.value || '').trim();
            const msg  = (cMsg?.value || '').trim();
            if (!msg || !imgKey) return;
            const fd = new FormData();
            fd.append('post_comment','1');
            fd.append('type','gallery');
            fd.append('key', imgKey);
            fd.append('name', name || 'Guest');
            fd.append('message', msg);
            const res  = await fetch('comments.php',{method:'POST',body:fd});
            const data = await res.json();
            if (data.status === 'ok' && cList) {
                if (cMsg) cMsg.value = '';
                const ent = data.entry;
                const div = document.createElement('div');
                div.style.cssText = 'border-bottom:1px solid rgba(255,255,255,0.08);padding:1px 0;';
                div.innerHTML = '<strong style="color:#aed581;">' + ent.name + '</strong>' +
                    '<span style="color:#666;font-size:0.7rem;margin:0 4px;">' + ent.date + '</span>' + ent.message;
                cList.prepend(div);
            }
        };
    }
    if (cMsg) {
        cMsg.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); cBtn && cBtn.click(); } };
    }

    const dlEl = document.getElementById('lb-dl');
    if (p.dl) { dlEl.href = p.dl; dlEl.style.display = ''; }
    else       { dlEl.style.display = 'none'; }

    // Preload next 3
    for (let i = 1; i <= 3; i++) {
        const n = (lbIdx + i) % currentPhotos.length;
        const m = currentPhotos[n];
        if (m.type === 'image' && !preloaded[m.src]) {
            const x = new Image(); x.src = m.src; preloaded[m.src] = x;
        }
    }
}

document.addEventListener('keydown', e => {
    if (!document.getElementById('lb').classList.contains('on')) return;
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    lbMove(-1);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown')   lbMove(1);
    if (e.key === 'Escape')                                lbClose();
});
document.getElementById('lb').addEventListener('click', e => {
    if (e.target === document.getElementById('lb')) lbClose();
});
let _tx = null;
document.getElementById('lb').addEventListener('touchstart', e => { _tx = e.touches[0].clientX; }, { passive: true });
document.getElementById('lb').addEventListener('touchend',   e => {
    if (_tx === null) return;
    if (Math.abs(e.changedTouches[0].clientX - _tx) > 40)
        lbMove(e.changedTouches[0].clientX < _tx ? 1 : -1);
    _tx = null;
}, { passive: true });

// ── Boot ──────────────────────────────────────────────────────
activeCanvas  = document.getElementById('gallery-canvas-a');
standbyCanvas = document.getElementById('gallery-canvas-b');

if (ALL_PHOTOS.length === 0) {
    document.getElementById('gallery-empty').classList.add('on');
    document.getElementById('empty-msg').textContent =
        'Add photos or videos to images/Gallery/ to get started.';
    lodr.classList.add('done');
} else {
    startGallery(ALL_PHOTOS);
}
</script>
