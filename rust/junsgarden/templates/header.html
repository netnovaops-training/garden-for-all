                 the Android app uses, so the site and the app match. Replaced a

                 border-radius clips the icon's square green backing to a circle
                 so it sits on the header the way the old SVG's circle did; the
                 icon already has a circle outline inside that lines up with it. -->
            <img class="logo-jk" src="/ic_launcher_playstore.png"
                 width="44" height="44" alt="J&amp;K Garden logo"
                 style="flex-shrink:0; border-radius:50%; display:block;

            Jun's and Kona's Garden

                            <line x1="16.5" y1="2" x2="18.5" y2="5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <!-- Head -->
                            <path d="M5,10.5 A7,5.5 0 0,1 19,10.5 L19,14 A7,5.5 0 0,1 5,14 Z" fill="currentColor"/>

                            <circle cx="9" cy="12" r="0.9" fill="white"/>

                            <rect x="20" y="14" width="2.5" height="5.5" rx="1.25" fill="currentColor"/>

                            <rect x="7" y="21" width="2.5" height="3" rx="1.25" fill="currentColor"/>
