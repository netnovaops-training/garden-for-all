<div class="widget-card" data-tags="iot soil moisture sensor future">
    <div class="widget-header">
        <span class="widget-icon">💧</span>
        <h3>Soil Moisture by Bed (IoT Mock)</h3>
    </div>
    <div class="widget-body">
        <div style="background:#fff3e0;border:1px solid #ffe0b2;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:0.78rem;color:#e65100;">
            <strong>🔌 IoT Preview</strong> — This widget uses simulated data. Connect soil moisture sensors to see real readings per bed.
        </div>
        <canvas id="wgt-iot-soil"></canvas>
    </div>
    <script>
    (function(){
        new Chart(document.getElementById('wgt-iot-soil').getContext('2d'), {
            type: 'bar',
            data: {
                labels: {{ labels_json|safe }},
                datasets: [
                    {
                        label: 'Current Moisture %',
                        data: {{ current_json|safe }},
                        backgroundColor: {{ colors_json|safe }},
                        borderWidth: 1, borderRadius: 4
                    },
                    {
                        label: 'Optimal Level %',
                        data: {{ optimal_json|safe }},
                        type: 'line',
                        borderColor: '#F44336',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 3,
                        pointBackgroundColor: '#F44336',
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: true,
                plugins: { legend: { display: true, position: 'top', labels: { boxWidth: 12, font: { size: 10 } } } },
                scales: {
                    y: { beginAtZero: true, max: 100, ticks: { callback: function(v){ return v + '%'; } },
                         title: { display: true, text: 'Moisture %', font: { size: 11 } } },
                    x: { ticks: { maxRotation: 45, font: { size: 9 } } }
                }
            }
        });
        if(window.registerWidgetChart) window.registerWidgetChart('wgt-iot-soil', {{ labels_json|safe }}, {{ current_json|safe }}, {label:'Moisture %', indexAxis:'x'});
    })();
    </script>
</div>
