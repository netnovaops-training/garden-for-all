[package]
name = "junsgarden"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "junsgarden"
path = "src/main.rs"

[dependencies]
common.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
askama.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
anyhow.workspace = true
sqlx.workspace = true
# For garden_blog.created_at (DATETIME). sqlx's own `chrono` feature
# maps it to NaiveDateTime; this brings the type itself into scope so the
# template can format it.
chrono.workspace = true
rand.workspace = true
time.workspace = true
serde_urlencoded = "0.7"
image.workspace = true
webp.workspace = true
md5.workspace = true
multer.workspace = true
futures-util.workspace = true
reqwest.workspace = true
# The two logins: password hashes, reset-link hashes, the reset email.
argon2.workspace = true
sha2.workspace = true
lettre.workspace = true
# The /help pages: the guides' Markdown as HTML (pulldown-cmark), and the
# accent folding Python-Markdown does for English anchors (unicode-normalization),
# so a heading's anchor on the site is the same as in the handbook.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
unicode-normalization = "0.1"
# The garden's own address (address.rs): the app trusts an address change only when it is
# signed with the garden's key (Ed25519), and labels carry QR codes made here (drawn into a PNG
# with the `image` crate above, so qrcode needs none of its own image features).
ed25519-dalek = { version = "3", default-features = false }
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# The /help tests send requests straight to the router (`oneshot`), no network.
tower = { workspace = true, features = ["util"] }
