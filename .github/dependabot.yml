# Dependabot version updates.
#
# All update pull requests go to the `fixes` branch, never straight to main: they are looked at
# there and reach main with the rest of the fixes. (Dependabot's separate SECURITY updates ignore
# target-branch and still go to the default branch; the code-fingerprints workflow keeps the public
# list right when one of those is merged.)
# Once a week, Monday 05:00 Pacific time. Minor and patch updates of one folder arrive together
# in a single pull request; a major update is its own pull request.
# Python: beds/requirements.txt and .github/requirements/*.txt are pip-compile files (versions AND
# checksums), made from the .in files next to them; Dependabot updates both together.
version: 2

updates:
  - package-ecosystem: pip
    directories: ["/beds", "/.github/requirements"]
    target-branch: fixes
    # wait a week after a version is published: brand-new releases are where bad packages hide
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

