# rust-clippy runs a set of lints that catch common mistakes in the Rust code in rust/
# (https://github.com/rust-lang/rust-clippy) and uploads the result as code-scanning alerts
# in the Security tab, under the category "rust-clippy".
#
# Started from GitHub's template. Changes: every action is pinned to a full commit SHA, the
# archived actions-rs/toolchain is replaced by the rustup that is already on the runner, the
# two helper programs are pinned and cached, and the job runs on every branch that is worked on.
name: rust-clippy analyze

on:
  push:
    branches: [main, fixes, enhancements]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: '39 23 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rustup is already on the runner)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
          cargo clippy --version

      - name: Cache the two helper programs
        id: helpers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/clippy-sarif
            ~/.cargo/bin/sarif-fmt
          key: helpers-clippy-sarif-0.8.0-sarif-fmt-0.8.0-${{ runner.os }}

      - name: Install clippy-sarif and sarif-fmt (pinned)
        if: steps.helpers.outputs.cache-hit != 'true'
        run: cargo install --locked clippy-sarif --version 0.8.0 && cargo install --locked sarif-fmt --version 0.8.0

      - name: Run rust-clippy
        working-directory: rust
        run:
          cargo clippy
          --all-features
          --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: rust/rust-clippy-results.sarif
          category: rust-clippy
          wait-for-processing: true
