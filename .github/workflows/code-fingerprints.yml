# Keeps CODE-FINGERPRINTS.txt right.
#
# Jun's installs follow `main` and check every downloaded file against the public list
# CODE-FINGERPRINTS.txt (fail closed). A commit that changes a tracked file without
# refreshing the list therefore breaks every first start. The pre-commit hook does the
# refresh for local commits, but not for commits made on github.com (merging a Dependabot
# pull request, a code-scanning autofix, an edit in the web editor).
#
#   push to main or fixes  ->  job `refresh` makes the list again and, only if it
#                                          changed, opens (or updates) a pull request
#                                          "Refresh the code fingerprints" from the branch
#                                          bot/fingerprints-<branch>. It never pushes to
#                                          main or fixes itself: a person merges it.
#   pull request into main             ->  job `fingerprints-in-sync` only CHECKS (no write).
#   workflow_dispatch                  ->  same as a push, for the branch it is run on.
#
# The bot's commit changes nothing but CODE-FINGERPRINTS.txt, which is in paths-ignore, and
# anything done with the built-in GITHUB_TOKEN does not start new workflow runs, so it cannot
# loop (it also means the check above does not run on the bot's own pull request; the list
# is made by the same script, so there is nothing for it to catch).
# Needs, once, in the repository's Settings > Actions > General: "Allow GitHub Actions to
# create and approve pull requests".
name: code-fingerprints

on:
  push:
    branches: [main, fixes]
    paths-ignore:
      - CODE-FINGERPRINTS.txt
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprints-in-sync:
    # Check only: nothing is written or pushed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: fingerprints-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The list must match the files
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -u
          python3 tools/release/make_fingerprints.py --check || {
            {
              echo "### CODE-FINGERPRINTS.txt is stale"
              echo
              echo "Merge main into the branch, run \`python tools/release/make_fingerprints.py\`,"
              echo "\`git add CODE-FINGERPRINTS.txt\`, commit and push (see tools/release/README.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: The repository's own fingerprint test
        env:
          PYTHONIOENCODING: utf-8
        run: sh tools/release/tests/test-code-fingerprints.sh

  refresh:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes the bot/fingerprints-<branch> branch only
      pull-requests: write # opens the pull request for it
    concurrency:
      group: fingerprints-${{ github.ref }}
      cancel-in-progress: true # only the newest list matters
    env:
      BRANCH: ${{ github.ref_name }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        # The token stays in the checkout's git config because the next step pushes with it.

      - name: Make the list again; if it changed, propose it as a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$BRANCH" in bot/*) echo "A bot branch: nothing to do."; exit 0 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/release/make_fingerprints.py
          git add CODE-FINGERPRINTS.txt
          if git diff --cached --quiet; then
            echo "CODE-FINGERPRINTS.txt is already right on $BRANCH: nothing to propose." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bot="bot/fingerprints-$BRANCH"
          git commit -q -m "Refresh the code fingerprints"
          # The bot branch is derived data: always the newest list on top of the newest branch.
          git push -f origin "HEAD:refs/heads/$bot"
          if [ -z "$(gh pr list --head "$bot" --base "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$bot" --base "$BRANCH" --title "Refresh the code fingerprints ($BRANCH)" \
              --body "Made by the code-fingerprints workflow: CODE-FINGERPRINTS.txt again for the newest $BRANCH. Only that file changes. Installs that follow $BRANCH check every file against this list, so merge it soon."
          fi
          echo "Proposed a refreshed CODE-FINGERPRINTS.txt for $BRANCH on $bot." | tee -a "$GITHUB_STEP_SUMMARY"
